version: '3.8'

services:
  kkmproxy:
    build:
      context: ./KkmProxy
      dockerfile: Dockerfile
    image: carwash-kkmproxy:latest
    container_name: carwash-kkmproxy
    restart: unless-stopped
    isolation: process   # Hyper-V только если нужен более сильный изолят
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000