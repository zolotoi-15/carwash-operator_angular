name: Docker Image CI

name: CI

on:
  push:
    branches: [main, cardbalance]
  pull_request:
    branches: [main, cardbalance]

jobs:
  # ---------- Angular build ----------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production

  # ---------- Backend sanity ----------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node -e "require('./routes/cards.js'); console.log('OK')"
        env:
          MONGO_URI: mongodb://localhost:27017/test

  # ---------- Docker build ----------
  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        run: docker build ./frontend -f ./frontend/Dockerfile -t carwash-frontend:ci
      - name: Build backend image
        run: docker build ./backend -f ./backend/Dockerfile -t carwash-backend:ci