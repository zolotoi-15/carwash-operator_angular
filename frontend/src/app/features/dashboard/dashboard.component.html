<div class="dashboard">
  <p class="welcome" *ngIf="auth.currentUser$() as user">
    Добро пожаловать, <strong>{{ user.fullName }}</strong>!
  </p>

  <div class="top-row">
    <app-kkm-status></app-kkm-status>
    <app-tank-levels></app-tank-levels>
    <app-shift-total></app-shift-total>
  </div>

  <h2 class="section-title">📋 Состояние постов мойки</h2>

  <div class="posts-grid">
    <app-post-card *ngFor="let id of postIds" [postId]="id"></app-post-card>
  </div>
</div>
