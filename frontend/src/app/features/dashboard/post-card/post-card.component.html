<div class="post-card" [class.busy]="busy" [class.offline]="!online">
  <!-- Flash при сканировании карты -->
  <div class="card-flash" *ngIf="cardFlashVisible && lastCardScan">
    💳 {{ lastCardScan.card }}
  </div>

  <div class="post-header">
    <span class="post-title">🚿 Пост {{ postId }}</span>
    <span class="post-status" [class.online]="online" [class.offline]="!online">
      {{ online ? '🟢 ESP32 подключён' : '🔴 ESP32 оффлайн' }}
    </span>
  </div>

  <div class="post-busy">
    <span [class.free]="!busy" [class.occupied]="busy">
      {{ busy ? '🔴 ЗАНЯТ' : '🟢 СВОБОДЕН' }}
    </span>
  </div>

  <div class="post-info">
    <div class="info-row">
      <span>💰 Баланс:</span>
      <span class="value">{{ balance | number:'1.2-2' }} ₽</span>
    </div>
    <div class="info-row">
      <span>🧼 Активная функция:</span>
      <span class="value">{{ activeFunction || '-' }}</span>
    </div>
  </div>

  <div class="functions">
    <button *ngFor="let fn of functions"
            class="fn-btn"
            [class.active]="activeFunction === fn"
            (click)="activateFunction(fn)">
      {{ fn }}
    </button>
  </div>

  <div class="sum-row">
    <span>Сумма</span>
    <span class="sum-value">{{ sum | number:'1.2-2' }} ₽</span>
  </div>

  <div class="actions">
    <button class="act-btn topup" (click)="topUp()">➕ Пополнить</button>
    <button class="act-btn stop"  (click)="stop()">⏹️ Остановить</button>
    <button class="act-btn pause" (click)="pause()">⏸️ Пауза</button>
    <button class="act-btn reset" (click)="reset()">🔄 Сброс</button>
    <button class="act-btn print" (click)="printReceipt()">🧾 Печать чека</button>
  </div>
</div>
