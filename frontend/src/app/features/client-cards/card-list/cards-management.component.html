<div class="cards-page">
  <header class="cards-header">
    <h2>💳 Карты клиентов</h2>

    <div class="search-bar">
      <input
        type="text"
        placeholder="Поиск по номеру карты, ФИО или телефону..."
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
      />
      <button type="button" (click)="scanCard()">Сканировать карту</button>
    </div>
  </header>

  <!-- Форма добавления новой карты -->
  <section class="add-card-form">
    <input
      type="text"
      placeholder="Номер карты"
      [(ngModel)]="newCard.card"
    />
    <input
      type="text"
      placeholder="ФИО (необязательно)"
      [(ngModel)]="newCard.fullName"
    />
    <input
      type="text"
      placeholder="Телефон (необязательно)"
      [(ngModel)]="newCard.phone"
    />
    <select [(ngModel)]="newCard.type">
      <option value="client">Клиент</option>
      <option value="operator">Оператор</option>
      <option value="service">Сервис</option>
    </select>
    <button type="button" (click)="addCard()">Добавить</button>
  </section>

  <!-- Таблица карт -->
  <table class="cards-table">
    <thead>
      <tr>
        <th>Номер карты</th>
        <th>ФИО</th>
        <th>Телефон</th>
        <th>Тип</th>
        <th>Баланс</th>
        <th>Пополнение</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let card of filteredCards">
        <td>{{ card.card }}</td>
        <td>{{ card.fullName || '—' }}</td>
        <td>{{ card.phone || '—' }}</td>
        <td>{{ card.type }}</td>
        <td>{{ card.balance | number:'1.2-2' }}</td>
        <td>
          <input
            type="number"
            min="0"
            step="0.01"
            placeholder="Сумма"
            [(ngModel)]="card.topUpAmount"
          />
          <button type="button" (click)="topUp(card)">Пополнить</button>
        </td>
        <td>
          <button type="button" (click)="openReport(card)">Отчёт</button>
          <button type="button" (click)="deleteCard(card)">Удалить</button>
        </td>
      </tr>
      <tr *ngIf="!filteredCards.length">
        <td colspan="7" class="empty">Карт не найдено</td>
      </tr>
    </tbody>
  </table>
</div>
