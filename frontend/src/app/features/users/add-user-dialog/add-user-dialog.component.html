<h2 mat-dialog-title>Добавить пользователя</h2>
<mat-dialog-content>
  <form [formGroup]="userForm" class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Имя</mat-label>
      <input matInput formControlName="name">
      <mat-error *ngIf="userForm.get('name')?.hasError('required')">Имя обязательно</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
      <mat-error *ngIf="userForm.get('email')?.hasError('required')">Email обязателен</mat-error>
      <mat-error *ngIf="userForm.get('email')?.hasError('email')">Некорректный email</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Группа</mat-label>
      <mat-select formControlName="group">
        <mat-option *ngFor="let g of groups" [value]="g">{{ g }}</mat-option>
      </mat-select>
      <mat-error *ngIf="userForm.get('group')?.hasError('required')">Выберите группу</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Отмена</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="userForm.invalid">
    Добавить
  </button>
</mat-dialog-actions>
