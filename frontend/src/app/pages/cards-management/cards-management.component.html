<div class="cards-management">
  <h2>💳 Карты клиентов</h2>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <div class="add-card">
    <input type="text"
           [(ngModel)]="newCardNumber"
           placeholder="Номер карты (например, 8C8ADC80)"
           maxlength="32" />
    <select [(ngModel)]="newCardType">
      <option value="client">Клиент</option>
      <option value="operator">Оператор</option>
      <option value="service">Администратор</option>
    </select>
    <button (click)="addCard()">Добавить</button>
  </div>

  <div *ngIf="loading">Загрузка...</div>

  <table *ngIf="!loading">
    <thead>
      <tr>
        <th>Номер карты</th>
        <th>Тип</th>
        <th>Баланс</th>
        <th>Пополнение</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let card of cards">
        <td>{{ card.card }}</td>
        <td>{{ typeLabel(card.type) }}</td>
        <td>{{ card.balance }}</td>
        <td class="topup-cell">
          <input type="number"
                 min="1"
                 [(ngModel)]="topUpAmounts[card.card]"
                 placeholder="Сумма" />
          <button (click)="topUp(card.card)">Пополнить</button>
        </td>
        <td>
          <button class="danger" (click)="deleteCard(card.card)">Удалить</button>
        </td>
      </tr>
      <tr *ngIf="cards.length === 0">
        <td colspan="5" class="empty">Карт нет</td>
      </tr>
    </tbody>
  </table>
</div>
