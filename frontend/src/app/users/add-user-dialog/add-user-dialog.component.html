<h2 mat-dialog-title>Добавить пользователя</h2>
<mat-dialog-content>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill">
      <mat-label>Имя</mat-label>
      <input matInput formControlName="name" required>
      <mat-error *ngIf="userForm.get('name')?.hasError('required')">
        Имя обязательно
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" required>
      <mat-error *ngIf="userForm.get('email')?.hasError('required')">
        Email обязателен
      </mat-error>
      <mat-error *ngIf="userForm.get('email')?.hasError('email')">
        Некорректный email
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Группа</mat-label>
      <mat-select formControlName="group" required>
        <mat-option *ngFor="let group of groups" [value]="group">
          {{ group }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="userForm.get('group')?.hasError('required')">
        Выберите группу
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Отмена</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="userForm.invalid">
    Добавить
  </button>
</mat-dialog-actions>
